<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: red;
            position: relative;
            animation-duration: 5s;
            animation-delay: 1s;
            animation-name: box;
        }
        @keyframes box {
            from{
                background-color: red;
            }
            to{
                background-color: yellow;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
