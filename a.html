<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient1</title>

    <style>

    .boxes{
        display: flex;
    }    

    .box1{
        height: 300px;
        width: 300px;
        background: linear-gradient(red, orange, yellow);
    }

    .box2{
        margin-left: auto;
        height: 300px;
        width: 400px;
        background: radial-gradient(red, orange, yellow, green);
    }

    </style>
</head>
<body>
    <div class="boxes">

    <div class="box1">

    </div>

    <div class="box2">

    </div>

    </div>
</body>
</html>
