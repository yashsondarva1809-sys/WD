<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            border-radius: 100%;
            position: relative;
            animation-duration: 0.5s;
            animation-name: box;
            animation-direction: alternate;
            animation-iteration-count: infinite;
        }
     
        @keyframes box {
            0%{
                left: 400px;
                top: 0;
            }
            100%{
                left: 400px;
                top: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcRKnx5_rQKogx6HUEMVu2DMfqdkRgd8zqDy4-Ur2NJHMFZFd0yOf4w9U4RMyEBPiP5m1JU-KPHaTOv9PyCIGX3m3r-AU9xbMOZ9Kiujnnnl6zbWTdeuyZGm" alt="" height="100px" width="100px">
    </div>
</body>
</html>
