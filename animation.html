<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>

    <style>
        .box{
            background-color: aqua;
            height: 100px;
            width: 100px;
            border-radius: 100%;
            animation-duration: 4s;
            animation-name: box;
            animation-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);
            position: relative;
            animation-iteration-count: infinite;
            animation-delay: 0s;
        }
        @keyframes box{
            0%{
                content: ;
                top: 0;
                left: 0;
            }
            25%{
                top: 600px;
                left: 0;
            }
            50%{
                top: 300px;
                left: 300px;
            }
            75%{
                top: 100px;
                right: 0;
            }
            100%{
                top: 0;
                right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
