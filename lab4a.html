<!DOCTYPE html>
<html>

<head>
    <title>FORM</title>
</head>

<body>
    <h1 align="center">STUDENT REGISTRATION FORM</h1>
    <table align="center" width="400px">


        <form action="">

            <tr>
                <td align="center">FULL NAME : </td>
                <td> <input type="text" name="name" id="name" placeholder="please enter the name"></td>
            </tr>

            <tr>
                <td><label for="">EMAIL</label></td>
                <td><input type="text" name="email" id="EMAIL"></td>
            </tr>

            <tr>
                <td><label for="">Mobile no.</label></td>
                <td><input type="email" name="Mobile" id=""></td>
            </tr>

            <tr>
                <td><label for="">Address</label></td>
                <td><textarea name="Address" id="Address"></textarea></td>
            </tr>

            <tr>
                <td> <label for="">NATIONALITY</label></td>
                <td><input type="text" name="nationality" id="nationality"></td>
            </tr>

            <tr>
                <td><label for="">DATE OF BIRTH</label></td>    
                <td><input type="date" id="date" name="date"></td>
            </tr>

            <tr>
                <td><label for="">gender</label></td>
                <td><input type="radio" name="gender" id="male">MALE</td>
                <td><input type="radio" name="gender" id="female">FEMALE</td>
            </tr>

            <tr>
                 <td><label for="">HEIGHEST DEGREE</label></td>
                 <td><select name="degree" id="degree">
                 <option value="" disabled selected>please select your degree</option>
                 <option value="">BCA</option>
                 <option value="">CSE</option>
                 <option value="">ECE</option>
                </select>
            </td>
                
            </tr>

            <tr>
                <td><label for="CPI" name="" id="">CPI</label></td>
                <td><input type="text" name="CPI" id="CPI"></td>
            </tr>

            <tr>
                <td><label for="UNIVERSITY" name="" id=""></label></td>
                <td><input type="text" name="UNIVERSITY" name="UNIVERSITY"></td>
            </tr>

            <tr>
                <td><label for="passing year" name="passing year" id="passing year" ></label></td>
                
            </tr>
            


        </form>
    </table>



</body>

</html>
