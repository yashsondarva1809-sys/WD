<!DOCTYPE html>
<html>

<head>
    <title>employee registration form</title>
</head>

<body>
    <table align="center" cellspacing="20">
        <h1 align="center">Employee Registration</h1>
        <h2 align="center">Personal Info</h2>
        <form action="">
            <tr>
                <td><label for="">Employee Id :</label></td>
                <td><input type="text" name="" id=""></td>
                <td><label for="">Employee Name :</label></td>
                <td><input type="text" name="" id=""></td>
            </tr>
            <tr>
                <td><label for="">Email :</label></td>
                <td><input type="email" name="" id=""></td>
                <td><label for=""> Contact :</label></td>
                <td><input type="number" name="" id="allow upto 10 digits"></td>
            </tr>
            <tr>
                <td><label for="">Martial Status</label></td>
                <td><input type="radio" name="Martial" id="yes">Yes</td>
                <td><input type="radio" name="Martial" id="no">No</td>
            </tr>

            <tr>
                <td>
                <th colspan="2">Educational Qualifications</th>
                </td>
            </tr>
            <tr>
                <td><label for="">Education :</label></td>
                <td><input type="text" name="" id=""></td>
                <td><label for="">Experience :</label></td>
                <td><input type="text" name="" id=""></td>

            <tr>
                <th colspan="4">Job Details</th>
            </tr>
            </tr>

            <tr>
                <td><label for="">Salary :</label></td>
                <td><input type="text" name="" id=""></td>
                <td> Job Location : </td>
            </tr>
            <tr>
                <td><label for=""> Designation :</label></td>
                <td><input type="text" name="" id=""></td>
            </tr>

            <tr>
                <td>
                    <button type="submit">Register</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </form>
    </table>
</body>
</head>

</html>
