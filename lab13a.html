<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        a:link{
            color: brown;
        }
        a:visited{
            color: blue;
        }
        p::selection{
            background-color: crimson;
        }
        button:hover{
            background-color: aqua;
        }
        input:focus{
            background-color: hotpink;
        }
    </style>
</head>

<body>

    <a href="www.google.com">Google</a>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fuga rem harum dicta unde! Delectus cupiditate accusamus
        laudantium eaque quo perferendis enim autem animi natus, ipsam voluptate fugit, consequuntur molestiae beatae!
    </p>
    <button>Click</button>
    <input type="text">
</body>

</html>
