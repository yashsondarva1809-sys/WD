<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: red;
            position: relative;
            animation-duration: 5s;
            animation-delay: 1s;
            animation-name: box;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(1, 0, 0, 1);
        }
        @keyframes box {
            0%{
                left: 0px;
                top: 0px;
            }
            25%{
                left: 300px;
                top: 0px;
            }
            50%{
                left: 300px;
                top: 300px;
            }
            75%{
                left: 0px;
                top: 300px;
            }
            100%{
                left: 0px;
                top: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
